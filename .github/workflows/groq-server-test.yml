name: Test Groq Gateway (server only)
on:
  push:
    branches: [groq-gateway]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test inference server
        run: python -m unittest discover -v
      - name: Ensure the server needs no Ollama or OpenRouter
        run: |
          ! grep -Eq 'OPENROUTER_API_KEY|OLLAMA_MODEL|openrouter.ai' server.py
