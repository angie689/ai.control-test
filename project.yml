name: AIController
options:
  bundleIdPrefix: com.angelintheskies
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  AIController:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ios/AIController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.angelintheskies.aicontroller
        PRODUCT_NAME: AIController
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AI Controller
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGNING_ALLOWED: NO
        SUPPORTS_MACCATALYST: NO
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
